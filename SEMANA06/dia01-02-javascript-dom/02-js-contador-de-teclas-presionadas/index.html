<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript + DOM: Contador de teclas presionadas</title>
</head>
<body>
    <h1>Contador de Teclas</h1>

    <p>Total de teclas presionadas: <span id="contador">0</span></p>
    <p>Última tecla que se ha presionado: <span id="ultima-tecla">Ninguna</span></p>

    <script>
        const contadorTecla = document.getElementById('contador')
        const ultimaTecla = document.getElementById('ultima-tecla')

        let contador = 0;

        document.addEventListener('keydown', function(event) {
            contador++
            
            let tecla = event.key

            if (tecla === ' ') {
                tecla = 'Espacio'
            }

            contadorTecla.textContent = contador
            ultimaTecla.textContent = tecla
        })
     /* TODO: Ejercicio - Contador de teclas presionadas

      Crea una página web que cuente cuántas teclas ha presionado el usuario.

      Cada vez que el usuario presione una tecla:

     * El contador debe aumentar en 1.
     * Debe mostrarse en pantalla la última tecla presionada.
     * La información debe actualizarse sin recargar la página.
     */
    </script>
</body>
</html>
